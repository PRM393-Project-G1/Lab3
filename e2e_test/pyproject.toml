[project]
name = "realtron-e2e"
version = "0.1.0"
description = "ARTEMIS end-to-end tests for the Realtron Android app"
requires-python = ">=3.12"
dependencies = [
  # Pinned commit: ARTEMIS changes quickly. Keep in sync with README.md.
  "artemis-client @ git+https://github.com/google/artemis.git@351ca8422f7b5b54e80a9c1ce03a222e02415b6b#subdirectory=packages/artemis-client",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-repeat>=0.9.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["."]
python_files = ["test_*.py"]
